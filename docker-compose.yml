# This file is for running the multi-container application locally for development and testing.
version: '3.8'

services:
  # The PostgreSQL Database Service
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=csat_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The CSAT Backend Application Service
  csat-backend:
    # Build the image from the Dockerfile in the current directory
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      # These environment variables will override application.properties
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/csat_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy # Waits for the db to be healthy before starting

volumes:
  db_data:
