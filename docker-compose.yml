
version: '3.8'

services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=csat_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The CSAT Backend Application Service
  csat-backend:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/csat_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: csat-frontend
    # Tell Docker Compose to build the image from the Dockerfile
    # located in the 'csat-frontend' directory.
    build:
      context: ./csat-frontend # Assumes your frontend is in a 'csat-frontend' folder
    restart: always
    ports:
      # Map port 8081 on your machine to port 80 in the Nginx container
      # to avoid conflicting with the backend on port 8080.
      - "8081:80"
    depends_on:
      # This ensures the backend is running before the frontend starts
      - csat-backend

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
